services:
  - type: web
    name: convoy-backend
    runtime: node
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: OFF_ROUTE_THRESHOLD_METERS
        value: "75"
      - key: SPLIT_THRESHOLD_METERS
        value: "5000"
      # App-level 3-day free trial. On since 2026-11-10 (iOS 2.0.1 / Android 2.1.0 handle
      # TRIAL_EXPIRED). Each free rider's 3 days start on their first request after it is on.
      - key: TRIAL_ENFORCEMENT_ENABLED
        value: "true"
      # Product analytics (PostHog). Unset = nothing is sent. The project API key is the same
      # public write-only key the apps embed; the host depends on the project's region
      # (https://us.i.posthog.com or https://eu.i.posthog.com).
      - key: POSTHOG_API_KEY
        sync: false
      - key: POSTHOG_HOST
        value: https://us.i.posthog.com
      # Google Play subscription verification. Until these are set, Play
      # activations answer 502 PLAY_VERIFICATION_UNAVAILABLE and the Apple
      # path is unaffected.
      - key: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
        sync: false
      - key: ANDROID_PACKAGE_NAME
        value: com.danglingmind.convotrack
